openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: session-check
    description: Manual-only FairFare session-check job operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/session-check:
    post:
      operationId: createSessionCheck
      tags: [session-check]
      summary: Create a manual session-check job
      description: >
        Creates a job record. The current worker cannot verify an authenticated
        session unattended, so the default result is not-verified and no browser
        session is started.
      security:
        - WorkerServiceBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCheckRequest"
      responses:
        "202":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCheckJob"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "415":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /v1/session-check/{jobId}:
    get:
      operationId: getSessionCheck
      tags: [session-check]
      summary: Get a session-check job
      security:
        - WorkerServiceBearer: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCheckJob"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    WorkerServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque service token
  responses:
    ApiError:
      description: Safe API error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SessionCheckRequest:
      type: object
      additionalProperties: false
      description: No input fields are accepted; omit the body or send an empty JSON object.
    SessionCheckJob:
      type: object
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, verified, not-verified, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/SessionCheckResult"
      required: [jobId, status, createdAt, updatedAt, result]
    SessionCheckResult:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required: [code, message]
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]

